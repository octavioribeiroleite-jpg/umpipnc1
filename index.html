<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Renovo IPNC</title>
    <meta name="description" content="Sistema de gestão - Igreja Presbiteriana de Nova Carapina" />
    <meta name="author" content="IPNC" />
    <meta name="theme-color" content="#f7fbf8" />
    <meta name="color-scheme" content="light dark" />
    <script id="ipnc-system-theme-boot">
      // Apply before styles/modules load, so dark devices never paint a white opening.
      (() => {
        const dark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
        const mode = dark ? 'dark' : 'light';
        const color = dark ? '#0d1210' : '#f7fbf8';
        const root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.ipncTheme = mode;
        root.style.colorScheme = mode;
        root.style.setProperty('--ipnc-boot-background', color);
        root.style.setProperty('--app-edge-background', color);
        document.querySelector('meta[name="theme-color"]').content = color;
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Renovo IPNC" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v5.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32-v4.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=ipnc-v4" />
    <link rel="manifest" href="/manifest.json?v=ipnc-access-v6" />
    <link rel="preload" as="image" href="/src/assets/logo-ipnc.png" fetchpriority="high" />
    <link rel="stylesheet" href="/src/opening.css" />

    <meta property="og:title" content="Renovo IPNC" />
    <meta property="og:description" content="Sistema de gestão - Igreja Presbiteriana de Nova Carapina" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://renovo-ipnc.octavioribeiroleite.chatgpt.site/icons/ipnc-social-v4.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Logo oficial IPNC" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://renovo-ipnc.octavioribeiroleite.chatgpt.site/icons/ipnc-social-v4.png" />
    <meta name="twitter:image:alt" content="Logo oficial IPNC" />
    <style>
      html,body{margin:0;min-height:100%;background:var(--ipnc-boot-background,#f7fbf8)}
      @media(prefers-color-scheme:dark){:root{--ipnc-boot-background:#0d1210}}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="ipnc-opening" class="ipnc-opening-surface" data-opening-state="loading" role="status" aria-label="Carregando IPNC">
      <div class="ipnc-opening-backdrop" aria-hidden="true">
        <img class="ipnc-opening-canopy" src="/opening-canopy-v1.svg" alt="" />
        <img class="ipnc-opening-floor" src="/opening-floor-v1.svg" alt="" />
      </div>
      <div class="ipnc-opening-center"><div class="ipnc-loading-splash-content"><img data-opening-logo src="/src/assets/logo-ipnc.png" alt="IPNC" width="200" height="200" fetchpriority="high" /><div class="ipnc-loading-indicator" aria-hidden="true"><p>Carregando…</p></div></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
