name: Redesign society selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-society-selector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply professional society selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Auth.tsx')
          text = path.read_text()

          import_anchor = "import { BuildStamp } from '@/components/BuildStamp';"
          import_line = "import SocietySelector from '@/components/auth/SocietySelector';"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          old_header = '''        <div className={`text-center mb-8 transition-all duration-700 ${showCards ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`}>
          <div className="inline-block animate-logo-pulse mb-4">
            <img
              src={logoIpnc}
              alt="Renovo IPNC"
              className="h-52 w-52 sm:h-64 sm:w-64 mx-auto object-contain drop-shadow-[0_24px_45px_rgba(0,0,0,0.55)]"
            />
          </div>
          <h1 className="font-display text-4xl font-bold text-white drop-shadow-lg">
            Bem-vindo
          </h1>
          <p className="text-white/78 text-base mt-2">
            Igreja Presbiteriana de Nova Carapina
          </p>
        </div>'''

          new_header = '''        <div className={`text-center transition-all duration-700 ${step === 'diretoria' && diretoriaStep === 'societies' ? 'mb-5' : 'mb-8'} ${showCards ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`}>
          <div className={`inline-block animate-logo-pulse ${step === 'diretoria' && diretoriaStep === 'societies' ? 'mb-2' : 'mb-4'}`}>
            <img
              src={logoIpnc}
              alt="Renovo IPNC"
              className={`${step === 'diretoria' && diretoriaStep === 'societies' ? 'h-28 w-28 sm:h-32 sm:w-32' : 'h-52 w-52 sm:h-64 sm:w-64'} mx-auto object-contain drop-shadow-[0_24px_45px_rgba(0,0,0,0.55)]`}
            />
          </div>
          {!(step === 'diretoria' && diretoriaStep === 'societies') && (
            <>
              <h1 className="font-display text-4xl font-bold text-white drop-shadow-lg">
                Bem-vindo
              </h1>
              <p className="text-white/78 text-base mt-2">
                Igreja Presbiteriana de Nova Carapina
              </p>
            </>
          )}
        </div>'''

          if old_header not in text:
              raise SystemExit('Logo/header block not found')
          text = text.replace(old_header, new_header, 1)

          start_marker = "        ) : step === 'diretoria' && diretoriaStep === 'societies' ? ("
          end_marker = "        ) : step === 'membro' && membroStep === 'societies' ? ("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Society selector block not found')

          new_selector = '''        ) : step === 'diretoria' && diretoriaStep === 'societies' ? (
          <SocietySelector
            societies={societies}
            loading={pinLoading}
            onBack={handleBack}
            onSelect={handleSelectDiretoriaSociety}
            onSelectPastor={() => handleSelectDiretoriaSociety({ id: 'pastor', name: 'Pastor', slug: 'pastor', color: '#173A63' })}
          />
'''
          text = text[:start] + new_selector + text[end:]

          text = text.replace(
              'className="min-h-screen relative overflow-hidden bg-black"',
              'className="min-h-screen relative overflow-x-hidden bg-black"',
              1,
          )

          old_content_class = "className={`relative z-20 min-h-screen flex items-center justify-center p-4 transition-all duration-500 ${isExiting ? 'opacity-0 scale-105' : 'opacity-100 scale-100'}`}"
          new_content_class = "className={`relative z-20 min-h-screen flex justify-center p-4 transition-all duration-500 ${step === 'diretoria' && diretoriaStep === 'societies' ? 'items-start py-6' : 'items-center'} ${isExiting ? 'opacity-0 scale-105' : 'opacity-100 scale-100'}`}"
          if old_content_class not in text:
              raise SystemExit('Content wrapper class not found')
          text = text.replace(old_content_class, new_content_class, 1)

          path.write_text(text)
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit redesign
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Auth.tsx src/components/auth/SocietySelector.tsx
          git commit -m "Redesenha seleção de sociedades"
          git push origin main
