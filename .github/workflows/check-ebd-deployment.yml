name: Validar Renovo IPNC
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: node --experimental-strip-types --test tests/*.mjs tests/*.ts
      - run: npm run build
      # EBD tables must NOT be readable anonymously. Authenticated integration
      # tests use isolated fixtures, never real student data in CI logs.
