name: Fix Secretaria navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-secretaria-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch navigation and exit behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          secretaria_path = Path('src/pages/Secretaria.tsx')
          text = secretaria_path.read_text()

          text = text.replace(
              "      return <ProfileSelect onSelect={handleProfileSelect} onBack={() => navigate('/auth')} />;",
              "      return <ProfileSelect onSelect={handleProfileSelect} onBack={() => navigate('/auth', { replace: true, state: { skipSplash: true } })} />;",
          )

          text = text.replace(
              "    navigate('/auth');",
              "    navigate('/auth', { replace: true, state: { skipSplash: true } });",
              1,
          )

          text = text.replace(
              "                onClick={handleExitApp}\n                className=\"p-1 -ml-1 text-muted-foreground hover:text-foreground transition-colors\"",
              "                onClick={() => navigate('/auth', { replace: true, state: { skipSplash: true } })}\n                aria-label=\"Voltar\"\n                className=\"p-1 -ml-1 text-muted-foreground hover:text-foreground transition-colors\"",
              1,
          )

          home_end = """          </div>\n        </div>\n      </div>\n    );\n  }\n\n  // Sub-views with back button"""
          home_end_replacement = """          </div>\n        </div>\n\n        <AlertDialog open={showExitConfirm} onOpenChange={setShowExitConfirm}>\n          <AlertDialogContent>\n            <AlertDialogHeader>\n              <AlertDialogTitle>Sair da Secretaria?</AlertDialogTitle>\n              <AlertDialogDescription>\n                Você será desconectado e voltará para a tela de login da secretaria.\n              </AlertDialogDescription>\n            </AlertDialogHeader>\n            <AlertDialogFooter>\n              <AlertDialogCancel>Cancelar</AlertDialogCancel>\n              <AlertDialogAction onClick={confirmExit}>Sair</AlertDialogAction>\n            </AlertDialogFooter>\n          </AlertDialogContent>\n        </AlertDialog>\n      </div>\n    );\n  }\n\n  // Sub-views with back button"""
          if home_end not in text:
              raise SystemExit('Home return anchor not found')
          text = text.replace(home_end, home_end_replacement, 1)
          secretaria_path.write_text(text)

          auth_path = Path('src/pages/Auth.tsx')
          auth = auth_path.read_text()
          auth = auth.replace(
              "import { useNavigate } from 'react-router-dom';",
              "import { useLocation, useNavigate } from 'react-router-dom';",
              1,
          )
          auth = auth.replace(
              "  const navigate = useNavigate();\n  const { toast } = useToast();",
              "  const navigate = useNavigate();\n  const location = useLocation();\n  const skipSplash = Boolean((location.state as { skipSplash?: boolean } | null)?.skipSplash);\n  const { toast } = useToast();",
              1,
          )
          old_effect = """  useEffect(() => {\n    if (!videoReady) return;\n    const elapsed = Date.now() - splashStartRef.current;"""
          new_effect = """  useEffect(() => {\n    if (skipSplash) {\n      setSplashPhase('done');\n      setShowCards(true);\n      return;\n    }\n    if (!videoReady) return;\n    const elapsed = Date.now() - splashStartRef.current;"""
          if old_effect not in auth:
              raise SystemExit('Auth splash anchor not found')
          auth = auth.replace(old_effect, new_effect, 1)
          auth = auth.replace("  }, [videoReady]);", "  }, [videoReady, skipSplash]);", 1)
          auth_path.write_text(auth)
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Secretaria.tsx src/pages/Auth.tsx
          git commit -m "Corrige voltar e sair da Secretaria EBD"
          git push origin main
