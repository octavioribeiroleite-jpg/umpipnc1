name: Improve login readability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-auth-readability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Improve login screen contrast
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Auth.tsx')
          text = path.read_text()

          replacements = [
              (
                  'className="px-1 text-[11px] font-bold uppercase tracking-[0.24em] text-white/65"',
                  'className="px-1 text-[13px] font-semibold uppercase tracking-[0.20em] text-white/90 drop-shadow-[0_2px_5px_rgba(0,0,0,0.85)]"',
              ),
              (
                  "'border-white/45 bg-[#F7FAF6]/95 text-foreground hover:bg-white'",
                  "'border-white/70 bg-white/95 text-slate-950 hover:bg-white shadow-[0_20px_55px_rgba(0,0,0,0.28)]'",
              ),
              (
                  "variant === 'glass' ? 'text-white' : 'text-foreground'",
                  "variant === 'glass' ? 'text-white' : 'text-slate-950'",
              ),
              (
                  "variant === 'glass' ? 'text-white/70' : 'text-muted-foreground'",
                  "variant === 'glass' ? 'text-white/80' : 'text-slate-600'",
              ),
              (
                  "variant === 'glass' ? 'text-white/75' : 'text-muted-foreground'",
                  "variant === 'glass' ? 'text-white/85' : 'text-slate-600'",
              ),
              (
                  'className="font-display text-4xl font-bold text-white drop-shadow-lg"',
                  'className="font-display text-4xl font-bold text-white drop-shadow-[0_4px_14px_rgba(0,0,0,0.95)]"',
              ),
              (
                  'className="text-white/78 text-base mt-2"',
                  'className="mt-2 text-base font-medium text-white/95 drop-shadow-[0_3px_10px_rgba(0,0,0,0.95)]"',
              ),
              (
                  'className="mx-auto flex items-center justify-center rounded-full border border-white/15 bg-black/20 px-4 py-2 text-center text-xs font-medium text-white/55 backdrop-blur-md transition-colors hover:bg-white/10 hover:text-white/85"',
                  'className="mx-auto flex items-center justify-center rounded-full border border-white/40 bg-black/55 px-5 py-2.5 text-center text-sm font-semibold text-white/95 shadow-lg backdrop-blur-md transition-colors hover:bg-black/70 hover:text-white"',
              ),
              (
                  'className={`text-center text-xs text-white/45 mt-6 transition-all duration-500 ${showCards ? \'opacity-100\' : \'opacity-0\'}`}',
                  'className={`mt-6 text-center text-sm font-medium text-white/75 drop-shadow-[0_2px_8px_rgba(0,0,0,0.95)] transition-all duration-500 ${showCards ? \'opacity-100\' : \'opacity-0\'}`}',
              ),
              (
                  'bg-[radial-gradient(circle_at_50%_18%,rgba(47,191,122,0.18),transparent_34%),linear-gradient(180deg,rgba(7,25,17,0.55),rgba(3,12,8,0.78))]',
                  'bg-[radial-gradient(circle_at_50%_18%,rgba(47,191,122,0.12),transparent_32%),linear-gradient(180deg,rgba(2,12,8,0.62),rgba(2,10,7,0.80)_52%,rgba(1,6,4,0.90))]',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit visual improvements
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Auth.tsx
          git commit -m "Melhora legibilidade da tela de entrada"
          git push origin main
