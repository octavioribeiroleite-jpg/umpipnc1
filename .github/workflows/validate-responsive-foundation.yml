name: Validate responsive foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-responsive-foundation.yml'
      - 'tailwind.config.ts'
      - 'src/main.tsx'
      - 'src/responsive-foundation.css'
      - 'src/components/layout/ResponsivePrimitives.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
