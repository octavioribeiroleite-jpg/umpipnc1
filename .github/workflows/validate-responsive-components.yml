name: Validate responsive components

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-responsive-components.yml'
      - 'src/components/layout/MobileHeader.tsx'
      - 'src/components/layout/PageHeader.tsx'
      - 'src/components/layout/SectionHeader.tsx'
      - 'src/components/ui/metric-card.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
